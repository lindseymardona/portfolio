<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#EFCECC"/>
  <!-- steam -->
  <g fill="none" stroke="#EFEEEC" stroke-width="2.6" stroke-linecap="round">
    <path d="M26 10 q-3 4 0 8 q3 4 0 8"/>
    <path d="M36 10 q3 4 0 8 q-3 4 0 8"/>
  </g>
  <!-- saucer -->
  <ellipse cx="31.5" cy="52" rx="17" ry="2.8" fill="#363133"/>
  <!-- cup body -->
  <path d="M17 28 L46 28 L42 47 Q41 50 37.5 50 L25.5 50 Q22 50 21 47 Z" fill="#363133"/>
  <!-- handle -->
  <path d="M45 31 C54 31 55 44 44 44" fill="none" stroke="#363133" stroke-width="4.2" stroke-linecap="round"/>
  <!-- rim / foam -->
  <ellipse cx="31.5" cy="28" rx="14.5" ry="3.6" fill="#EFEEEC"/>
  <!-- lm monogram on the cup -->
  <text x="31.5" y="42.5" text-anchor="middle" font-family="'Georgia','Times New Roman',serif"
        font-style="italic" font-weight="700" font-size="14" fill="#EFCECC">lm</text>
</svg>
